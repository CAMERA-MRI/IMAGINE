title: "IMAGINE: Imaging Without Borders"
description: "Open-source low-field preclinical MR scanner training and resources."
theme: jekyll-theme-cayman
permalink: pretty
baseurl: "/IMAGINE" # Set to "/IMAGINE" to match the repository subfolder on GitHub Pages.

collections:
  scanners:
    output: true
    permalink: /scanners/:path/
  components:
    output: true
    permalink: /components/:path/
  events:
    output: true
    permalink: /events/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - scratch/
  - build_preview.py
  - README.md
  - LICENSE
  - CITATION.cff
  - OSI_hardware_checklist.md
  - Build Lab schedule.md
  - task.md
  - walkthrough.md
  - implementation_plan.md

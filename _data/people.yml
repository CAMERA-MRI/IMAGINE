- name: "Dr. Udunna Anazodo"
  role: "Lead Investigator & Neuroscientist"
  affiliation: "The Neuro (Montreal Neurological Institute), McGill University"
  bio: "Dr. Anazodo leads the IMAGINE initiative. Her research focuses on making MRI technology globally accessible and sustainable, particularly for underserved populations in Sub-Saharan Africa and beyond."
  image: "assets/images/people/udunna.jpg"

- name: "Maureen Nayebare"
  role: "Lead Researcher & Workshop Instructor"
  affiliation: "McGill University / CAMERA"
  bio: "Maureen has led multiple hands-on construction and training workshops across Montreal (MNI, Douglas, MGH, Polytechnique). Her work spans RF coil prototyping and open science education."
  image: "assets/images/people/maureen.jpg"

- name: "Marina Fernández-García"
  role: "RF Systems Engineer"
  affiliation: "CAMERA / European Collaborators"
  bio: "Specializes in radiofrequency hardware design, tuning, matching, and active transmit-receive switch development for low-field MR applications."
  image: "assets/images/people/marina.jpg"

- name: "Haile B. Kassahun"
  role: "Electromagnetics & Gradient Optimization Engineer"
  affiliation: "Mbarara University of Science and Technology"
  bio: "Author of gradient design research. Focuses on wire optimization and CAD modeling of gradient formers using finite element methods."
  image: "assets/images/people/haile.jpg"

- name: "Guillermo Sahonero-Alvarez"
  role: "MR Physics & Systems Integration Developer"
  affiliation: "CAMERA / South American Partners"
  bio: "Responsible for pulse sequence programming and hardware-software system integration on the MaRCoS platform."
  image: "assets/images/people/guillermo.jpg"

- name: "Sipan Hovsepian"
  role: "Robotics & Automation Developer"
  affiliation: "The Neuro, McGill University"
  bio: "Developer of the automated three-axis magnetic field mapping robot (Field Mapper Robot) used for B0 field homogenization and shimming."
  image: "assets/images/people/sipan.jpg"

- name: "Timon Machtelinckx"
  role: "Magnet Designer & GA Developer"
  affiliation: "CAMERA / European Partners"
  bio: "Developer of the Halbach Array Genetic Algorithm optimization code, enabling automated optimization of ring arrays for homogeneous field profiles."
  image: "assets/images/people/timon.jpg"

- name: "Dr. Johnes Obungoloch"
  role: "Senior Biomedical Engineer & Advisor"
  affiliation: "Mbarara University of Science and Technology (MUST), Uganda"
  bio: "A key CAMERA member who has co-led on-site educational workshops in Uganda, supporting hardware replication and training programs."
  image: "assets/images/people/johnes.jpg"

- name: "Stefan du Plessis"
  role: "Biomedical Systems Coordinator"
  affiliation: "CAMERA / South African Collaborators"
  bio: "Organizes training workshops and oversees system assembly verification in South African partner sites."
  image: "assets/images/people/stefan.jpg"

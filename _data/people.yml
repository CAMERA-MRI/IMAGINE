- name: "Dr. Udunna Anazodo"
  role: "Lead Investigator & Neuroscientist"
  affiliation: "McConnell Brain Imaging Centre, The Neuro (McGill University)"
  bio: "Dr. Anazodo leads the IMAGINE initiative. She is an Assistant Professor of Neurology and Neurosurgery at McGill University and Chairs CAMERA, focusing on making MRI technology globally accessible and sustainable, particularly for underserved populations in Sub-Saharan Africa and beyond."
  image: "assets/images/people/udunna.jpg"

- name: "Maureen Nayebare"
  role: "Lead Researcher & Workshop Instructor"
  affiliation: "McGill University / CAMERA"
  bio: "Maureen is a graduate researcher at McGill University, focusing on RF coil prototyping, low-field MRI hardware, and open science capacity building. She has successfully led multiple hands-on construction and training workshops across Montreal (MNI, Douglas, Polytechnique, MGH)."
  image: "assets/images/people/maureen.jpg"

- name: "Marina Fernández-García"
  role: "CAMERA Operations Manager & i3M Researcher"
  affiliation: "Institute for Molecular Imaging and Instrumentation (i3M, UPV-CSIC)"
  bio: "Marina serves as the Operations Manager for CAMERA and is a PhD researcher at i3M in Valencia. She specializes in low-field portable MRI systems, permanent Halbach magnet array optimization, and global health capacity building."
  image: "assets/images/people/marina.jpg"

- name: "Haile B. Kassahun"
  role: "Electromagnetics & Gradient Optimization Engineer"
  affiliation: "Mbarara University of Science and Technology (MUST)"
  bio: "Haile focuses on electromagnetics and gradient former optimization for low-field portable scanners, developing advanced CAD models and implementing mathematical design patterns like the discrete wire method."
  image: "assets/images/people/haile.jpg"

- name: "Guillermo Sahonero-Alvarez"
  role: "MR Physics & Systems Integration Developer"
  affiliation: "Institute for Biological and Medical Engineering, Pontificia Universidad Católica de Chile"
  bio: "Guillermo is an MR physics developer focusing on the MaRCoS open-source console integration, sequence programming, low-field image reconstruction, and machine learning methods for portable MRI systems."
  image: "assets/images/people/guillermo.jpg"

- name: "Sipan Hovsepian"
  role: "Robotics & Automation Developer"
  affiliation: "McConnell Brain Imaging Centre, The Neuro (McGill University)"
  bio: "Sipan is an automation developer at McGill, having designed the three-axis automated magnetic field mapping robot (Field Mapper Robot) used for B0 magnetic field homogenization, calibration, and shimming."
  image: "assets/images/people/sipan.jpg"

- name: "Timon Machtelinckx"
  role: "Magnetics & Gradient Coil Designer"
  affiliation: "CAMERA Collaborator"
  bio: "Timon is a researcher specializing in magnetics and optimization. He developed the genetic algorithm models used for permanent Halbach magnet arrays and designed gradient coils optimized for low-field scanners."
  image: "assets/images/people/timon.jpg"

- name: "Dr. Johnes Obungoloch"
  role: "Senior Advisor & Head of Biomedical Engineering"
  affiliation: "Mbarara University of Science and Technology (MUST), Uganda"
  bio: "Dr. Obungoloch is the Head of the Department of Biomedical Engineering at MUST and a senior advisor for CAMERA. He has co-led on-site educational workshops in Uganda, supporting hardware replication and training programs."
  image: "assets/images/people/johnes.jpg"

- name: "Stefan du Plessis"
  role: "Biomedical Systems Coordinator"
  affiliation: "CAMERA / South African Collaborators"
  bio: "Stefan coordinates low-field MRI development and training workshops in South Africa, overseeing on-site assembly, testing, and hardware verification for regional partner labs."
  image: "assets/images/people/stefan.jpg"

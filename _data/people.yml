- name: "Dr. Udunna Anazodo"
  role: "Lead Investigator & Assistant Professor"
  affiliation: "McConnell Brain Imaging Centre, The Neuro (McGill University)"
  bio: "Dr. Anazodo leads the IMAGINE initiative and Chairs CAMERA (Consortium for Advancement of MRI Education & Research in Africa). She is an Assistant Professor of Neurology and Neurosurgery at McGill University's Montreal Neurological Institute (The Neuro), dedicated to democratizing accessible, low-field and sustainable diagnostic imaging in resource-limited settings globally."
  image: "assets/images/people/udunna.jpg"

- name: "Maureen Nayebare"
  role: "Lead Researcher & Workshop Instructor"
  affiliation: "McGill University / CAMERA"
  bio: "Maureen is a biomedical engineering researcher at McGill University working with CAMERA and the McConnell Brain Imaging Centre. Her research focuses on low-field MRI hardware, RF coil design and optimization, and hands-on capacity building, having directed construction workshops across multiple clinical and academic institutions in Montreal and internationally."
  image: "assets/images/people/maureen.jpg"

- name: "Marina Fernández-García"
  role: "CAMERA Operations Manager & i3M Researcher"
  affiliation: "Institute for Molecular Imaging and Instrumentation (i3M, CSIC - UPV)"
  bio: "Marina serves as the Operations Manager for CAMERA and is a doctoral researcher at the Institute for Molecular Imaging and Instrumentation (i3M, UPV-CSIC) in Valencia. She specializes in low-field portable MRI systems, permanent Halbach magnet array development, quantitative hard-tissue imaging, and international training programs."
  image: "assets/images/people/marina.jpg"

- name: "Haile B. Kassahun"
  role: "Electromagnetics & Gradient Optimization Engineer"
  affiliation: "Cairo University / Mbarara University of Science and Technology (MUST)"
  bio: "Haile is a biomedical engineering researcher specializing in electromagnetics, numerical gradient design, and optimization for low-field portable scanners. He developed discrete wire method optimization frameworks for Halbach array scanners and authored key publications on power-efficient actively shielded gradient coils."
  image: "assets/images/people/haile.jpg"

- name: "Guillermo Sahonero-Alvarez"
  role: "MRI Researcher & Doctoral Candidate"
  affiliation: "Institute for Biological and Medical Engineering (IIBM), Pontificia Universidad Católica de Chile"
  bio: "Guillermo is a doctoral candidate at the Institute for Biological and Medical Engineering (IIBM) at Pontificia Universidad Católica de Chile, affiliated with the Center for Biomedical Imaging (CIB) and the Millennium Institute for Intelligent Healthcare Engineering (iHEALTH). His research works at the intersection of MRI physics, scientific computing (Julia & Python), and artificial intelligence (deep learning and optimization), specializing in MRI simulations, sequence design, and optimization, and contributing to open-science initiatives such as MRI Together and CAMERA."
  image: "assets/images/people/guillermo.jpg"

- name: "Sipan Hovsepian"
  role: "Robotics & Automation Developer"
  affiliation: "McConnell Brain Imaging Centre, The Neuro (McGill University)"
  bio: "Sipan is an automation engineer and developer collaborating with McGill University and NYU Abu Dhabi. He designed and built the automated 3-axis Field Mapping Robot used for magnetic field homogenization, calibration, and shimming, and authored genetic algorithm optimization frameworks for Halbach magnet arrays."
  image: "assets/images/people/sipan.jpg"

- name: "Timon Machtelinckx"
  role: "Magnetics & Gradient Coil Designer"
  affiliation: "CAMERA Collaborator / LUMC"
  bio: "Timon is a researcher in biomedical engineering and magnetics. He co-developed genetic algorithm models to optimize the field homogeneity of permanent Halbach magnet arrays and contributed to the numerical design and optimization of gradient coils for low-field Halbach scanners."
  image: "assets/images/people/timon.jpg"

- name: "Dr. Johnes Obungoloch"
  role: "Senior Advisor & Associate Professor"
  affiliation: "Mbarara University of Science and Technology (MUST), Uganda"
  bio: "Dr. Obungoloch is an Associate Professor in the Department of Biomedical Engineering at MUST, Uganda, and a senior advisor for CAMERA. A pioneer in low-cost point-of-care MRI in low-resource settings, he has led the on-site construction of low-field scanners in Africa and advances global medical hardware education."
  image: "assets/images/people/johnes.jpg"

- name: "Stefan du Plessis"
  role: "Biomedical Systems Coordinator"
  affiliation: "Stellenbosch University / CAMERA Collaborator"
  bio: "Stefan is a medical and neuroimaging researcher at Stellenbosch University and CAMERA collaborator in South Africa. He coordinates low-field MRI development, on-site hardware verification, and educational workshop activities in the region, co-authoring research on gradient coil optimization for low-field Halbach scanners."
  image: "assets/images/people/stefan.jpg"
